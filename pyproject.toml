[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory-metronix"
version = "0.1.0"
description = "Standalone Hermes memory-provider plugin scaffold for Metronix"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Metronix Contributors" }]
dependencies = [
    "requests>=2.31,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
hermes-metronix-setup = "hermes_memory_metronix_setup.setup:main"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugin"]
markers = ["integration: tests that require a live Metronix backend"]
